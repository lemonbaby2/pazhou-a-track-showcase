model_type: qwen2_5

task:
  dof_config:
    master_right_ee_cartesian_pos: 3
    master_right_ee_rotation: 3
    master_right_gripper: 1
    action_padding: 19
  ar_dof_config:
    master_right_ee_cartesian_pos: 3
    master_right_ee_rotation: 3
    master_right_gripper: 1
    action_padding: 19
  agent_pos_config:
    follow_right_ee_cartesian_pos: 3
    follow_right_ee_rotation: 3
    follow_right_gripper: 2
    action_padding: 18
  action_horizon: 10
  action_horizon_flow: 10
  use_state_string_representation: false

model:
  backbone: qwen2_5
  config_path: /home/nvidia/models/wall-oss-0.5/config.json
  processor_path: /home/nvidia/models/Qwen2.5-VL-3B-Instruct
  pretrained_path: /home/nvidia/models/Qwen2.5-VL-3B-Instruct
  attn_deterministic: true
  use_ema: false
  flow_loss_weight: 1.0
  ar_loss_weight: 0.01

hyperparams:
  num_epoch: 1
  batch_size_per_gpu: 1
  gradient_accumulation_steps: 8
  seed: 10222
  optimizer:
    optimizer_type: adamw
    learning_rate: 5.0e-05
    max_grad_norm: 1.0
    enable_grad_clip: true
    betas: [0.9, 0.95]
    weight_decay: 1.0e-8
    eps: 1.0e-8
  scheduler:
    scheduler_type: cosine
    num_warmup_steps: 10
    num_training_steps: 20
    min_lr: 1.0e-6

distributed:
  use_fsdp: false
  use_mixed_precision: true
  bf16: true

data:
  dataset_type: lerobot
  lerobot_config:
    repo_id: /home/nvidia/datasets/libero_all
    root: null
  key_mappings:
    camera:
      observation.images.image: face_view
      observation.images.image2: right_wrist_view
    state: observation.state
    action: action
  norm_stats_path: /home/nvidia/runs/libero_norm_stats.json
  train_test_split: 0.95
  num_workers: 2
  max_length: 1024
  resolution:
    face_view: 256
    right_wrist_view: 256

logging:
  log_name: walloss_smoke
  log_project: walloss_libero
  log_entity: nvidia
  use_wandb: false
  log_interval: 1
  save_interval: 9999999
  val_interval: 1000000
  epoch_save_interval: 9999999

checkpoint:
  save_path: /home/nvidia/runs/walloss_smoke
  resume_from: /home/nvidia/models/wall-oss-0.5/model.safetensors

debug:
  profile: false
  nvtx: false
